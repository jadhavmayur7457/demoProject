<div class="container w-50 border mt-2 p-2">
    <form  #registrationform="ngForm" (ngSubmit)="submit(registrationform)">
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Name</label>
          <input type="text" class="form-control" id="exampleInputEmail1" name="fname" [(ngModel)]="Userobj.name" #fname="ngModel"  required maxlength="15" minlength="2">
          <div *ngIf="fname.invalid&&(fname.touched||fname.dirty)">
            <div class="invalid-feedback d-block" *ngIf="fname.errors?.['maxlength']|| fname.errors?.['minlength']">invalid length</div>
            <div class="invalid-feedback d-block"  *ngIf="fname.errors?.['required']">ites required</div>
            <div></div>
          </div>
        </div>
        <div class="mb-3">
          <label for="id2" class="form-label">email</label>
          <input type="email" class="form-control" id="id2" name="femail" [(ngModel)]="Userobj.email" required>
           
        </div>
        <div class="mb-3">
            <label for="id1" class="form-label">Mobile</label>
            <input type="text" class="form-control" id="id1" name="fmobile" [(ngModel)]="Userobj.mobilenum" required>
          </div>
          <div class="mb-3">
            <label for="id3" class="form-label">city</label>
            <input type="text" class="form-control" id="id3" name="city" [(ngModel)]="Userobj.city" required> 
          </div>
          <div class="mb-3">
            <label for="idc" class="form-label">pincode</label>
            <input type="number" class="form-control" id="idc" name="fpincode" [(ngModel)]="Userobj.address.pincode" required>
          </div>
          <div class="mb-3">
            <label for="idb" class="form-label">district</label>
            <input type="text" class="form-control" id="idb" name="fdistrict" [(ngModel)]="Userobj.address.district" required>
          </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      
      </form>
      <!-- <button class="btn btn-primary mt-1" (click)="getdatafill()">getdata</button> -->
</div>
<p> value:{{registrationform.value|json}}</p>
<p>touched:{{registrationform.touched}}</p>
<p>untouched:{{registrationform.untouched}}</p>
<p>pristine:{{registrationform.pristine}}</p>
<p>dirty:{{registrationform.dirty}}</p>
